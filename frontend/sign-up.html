<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aloft — Create Account</title>
<style>
  :root {
    --bg: #f7f8fc;
    --card: #ffffff;
    --text-primary: #0d0f14;
    --text-secondary: #5b6472;
    --text-muted: #9aa2ad;
    --input-border: #e3e6ec;
    --hairline: #ebedf2;
    --accent-blue: #1656d9;
    --track-bg: #e4e7ec;
    --weak: #d1352b;
    --fair: #e08a2c;
    --good: #cbb02c;
    --strong: #1656d9;
    --black: #0d0f14;
    --radius-pill: 999px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--card);
    font-family: var(--font-sans);
    color: var(--text-primary);
    height: 100%;
  }

  .layout {
    display: grid;
    grid-template-columns: 45% 55%;
    min-height: 100vh;
  }

  /* Left: image panel */
  .visual-panel {
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #cfd8e2, #99a6b5 55%, #4b5563);
    min-height: 100%;
  }

  .visual-panel svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .visual-panel::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(10,14,20,0.75) 0%, rgba(10,14,20,0.15) 45%, rgba(10,14,20,0) 65%);
  }

  .visual-copy {
    position: absolute;
    left: 40px;
    right: 40px;
    bottom: 48px;
    z-index: 2;
    color: #fff;
  }

  .visual-copy blockquote {
    margin: 0 0 18px;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  .visual-copy p {
    margin: 0;
    font-size: 15px;
    color: rgba(255,255,255,0.78);
    line-height: 1.5;
    max-width: 400px;
  }

  /* Right: form panel */
  .form-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }

  .form-inner { width: 100%; max-width: 450px; }

  .form-inner h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }

  .form-inner > p.lead {
    font-size: 15px;
    color: var(--text-secondary);
    margin: 0 0 36px;
  }

  .field {
    margin-bottom: 30px;
  }

  .field label {
    display: block;
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 12px;
  }

  .input-underline {
    position: relative;
  }

  .input-underline input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--input-border);
    padding: 4px 34px 12px 0;
    font-size: 16px;
    color: var(--text-primary);
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s ease;
  }

  .input-underline input::placeholder { color: var(--text-muted); }

  .input-underline input:focus { border-color: var(--accent-blue); }

  .toggle-visibility {
    position: absolute;
    right: 0;
    bottom: 10px;
    background: none;
    border: none;
    padding: 2px;
    cursor: pointer;
    color: var(--text-muted);
    display: flex;
  }
  .toggle-visibility:hover { color: var(--text-secondary); }
  .toggle-visibility svg { width: 19px; height: 19px; }

  .strength-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }

  .strength-track {
    flex: 1;
    display: flex;
    gap: 6px;
  }

  .strength-track .bar {
    height: 4px;
    flex: 1;
    border-radius: 4px;
    background: var(--track-bg);
    transition: background 0.2s ease;
  }

  .strength-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    white-space: nowrap;
    min-width: 46px;
    text-align: right;
  }

  .agree-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 30px;
  }

  .agree-row input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--input-border);
    border-radius: 5px;
    margin: 1px 0 0;
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .agree-row input[type="checkbox"]:checked {
    background: var(--black);
    border-color: var(--black);
  }

  .agree-row input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .agree-row label {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.5;
    cursor: pointer;
  }

  .agree-row a {
    color: var(--text-primary);
    font-weight: 600;
    text-decoration: none;
  }
  .agree-row a:hover { text-decoration: underline; }

  .submit-btn {
    width: 100%;
    background: var(--black);
    color: #fff;
    border: none;
    border-radius: var(--radius-pill);
    padding: 17px 20px;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s ease, transform 0.05s ease;
  }

  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .submit-btn:not(:disabled):hover { opacity: 0.88; }
  .submit-btn:not(:disabled):active { transform: scale(0.997); }

  .submit-btn svg {
    width: 17px; height: 17px;
    transition: transform 0.15s ease;
  }
  .submit-btn:not(:disabled):hover svg { transform: translateX(3px); }

  .signin-line {
    text-align: center;
    margin-top: 26px;
    font-size: 14px;
    color: var(--text-secondary);
  }

  .signin-line a {
    color: var(--text-primary);
    font-weight: 700;
    text-decoration: none;
  }
  .signin-line a:hover { text-decoration: underline; }

  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent-blue);
    outline-offset: 2px;
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .visual-panel { min-height: 280px; }
    .form-panel { padding: 32px 24px 60px; }
  }
</style>
</head>
<body>

<div class="layout">
  <div class="visual-panel">
    <svg viewBox="0 0 640 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <rect width="640" height="900" fill="#c7d0da"/>
      <path d="M0 300 C 120 260, 200 340, 300 300 S 480 220, 640 260 V0H0Z" fill="#dfe5ec"/>
      <path d="M-20 420 C 140 380, 220 470, 340 430 S 520 360, 660 400" fill="none" stroke="#9aa8b8" stroke-width="10" opacity="0.6"/>
      <path d="M-20 520 C 160 470, 260 560, 380 500 S 560 440, 660 480" fill="none" stroke="#8697aa" stroke-width="16" opacity="0.5"/>
      <path d="M-20 620 C 180 560, 300 660, 420 600 S 580 540, 660 580" fill="none" stroke="#75879c" stroke-width="22" opacity="0.55"/>
      <path d="M-20 700 C 160 660, 320 740, 460 680 S 600 640, 660 660" fill="none" stroke="#607388" stroke-width="14" opacity="0.5"/>
    </svg>
    <div class="visual-copy">
      <blockquote>&quot;The atmosphere is not an empty space, it is a fluid medium.&quot;</blockquote>
      <p>Join Aloft to access precision flight audio and environmental intelligence.</p>
    </div>
  </div>

  <div class="form-panel">
    <div class="form-inner">
      <h1>Create Account</h1>
      <p class="lead">Configure your precision audio profile.</p>

      <div class="form-error" id="formError" style="display:none; background:#fdecea; border:1px solid #f5c2bc; color:#b3261e; font-size:13.5px; padding:11px 14px; border-radius:10px; margin-bottom:18px;"></div>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <div class="input-underline">
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-underline">
            <input type="password" id="password" placeholder="" autocomplete="new-password" required>
            <button type="button" class="toggle-visibility" id="toggleVis" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength-row">
            <div class="strength-track" id="strengthTrack">
              <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <span class="strength-label" id="strengthLabel">Weak</span>
          </div>
        </div>

        <div class="agree-row">
          <input type="checkbox" id="agree" required>
          <label for="agree">I agree to the <a href="terms-of-service.html">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn" disabled>
          Initialize Profile
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <p class="signin-line">Already authenticated? <a href="Log_In__Light_.html">Sign in</a></p>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api-client.js"></script>
<script>
  // Already signed in? Skip straight to the dashboard.
  if (AloftAuth.isLoggedIn()) {
    window.location.href = 'Dashboard__Light_.html';
  }

  const password = document.getElementById('password');
  const bars = document.querySelectorAll('#strengthTrack .bar');
  const strengthLabel = document.getElementById('strengthLabel');
  const agree = document.getElementById('agree');
  const submitBtn = document.getElementById('submitBtn');
  const toggleVis = document.getElementById('toggleVis');

  const colors = ['', 'var(--weak)', 'var(--fair)', 'var(--good)', 'var(--strong)'];
  const labels = ['Weak', 'Weak', 'Fair', 'Good', 'Strong'];

  function scorePassword(pw) {
    if (!pw) return 0;
    let score = 1;
    if (pw.length >= 8) score++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw) && /\d/.test(pw)) score++;
    if (pw.length >= 12 && /[^A-Za-z0-9]/.test(pw)) score++;
    return Math.min(score, 4);
  }

  function updateStrength() {
    const pw = password.value;
    const score = pw ? scorePassword(pw) : 0;
    const displayScore = pw ? Math.max(score, 1) : 0;
    bars.forEach((bar, i) => {
      bar.style.background = i < displayScore ? colors[displayScore] : 'var(--track-bg)';
    });
    strengthLabel.textContent = pw ? labels[displayScore] : 'Weak';
    strengthLabel.style.color = pw ? colors[displayScore] : 'var(--text-muted)';
    checkFormValid();
  }

  function checkFormValid() {
    const emailVal = document.getElementById('email').value.trim();
    submitBtn.disabled = !(emailVal && password.value && agree.checked);
  }

  password.addEventListener('input', updateStrength);
  document.getElementById('email').addEventListener('input', checkFormValid);
  agree.addEventListener('change', checkFormValid);

  toggleVis.addEventListener('click', () => {
    const isPassword = password.type === 'password';
    password.type = isPassword ? 'text' : 'password';
    toggleVis.innerHTML = isPassword
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.6 20.6 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a20.6 20.6 0 0 1-3.22 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
    toggleVis.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
  });

  const errorBox = document.getElementById('formError');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
  }

  function hideError() {
    errorBox.style.display = 'none';
  }

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (submitBtn.disabled) return;
    hideError();

    const email = document.getElementById('email').value.trim();
    const pw = password.value;

    submitBtn.disabled = true;

    try {
      await AloftApi.signup(email, pw);
      // Signup auto-verifies accounts, so we can log the user straight in.
      await AloftApi.login(email, pw);
      window.location.href = 'Dashboard__Light_.html';
    } catch (err) {
      showError(err.message || 'Could not create your account. Please try again.');
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
