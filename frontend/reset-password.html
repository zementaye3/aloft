<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set New Password — Aloft</title>
<!--
  NOTE FOR NEXT SESSION: this page did not exist in the "Coded UI" designs —
  the only design we had was "Forgot_Password__Light_.html" (the request
  step). The backend's password-reset email links to
  "{FRONTEND_BASE_URL}/reset-password.html?token=..." (see
  backend/.env.example), so something had to exist at that path for the
  flow to actually work end to end. This page reuses Forgot Password's
  visual style exactly so it doesn't look out of place. If a real design
  gets made for this later, swap the markup/styles but keep the
  #resetForm / #newPassword / #confirmPassword ids and the token-from-URL
  logic in the script block below.
-->
<style>
  :root {
    --ink: #14172b;
    --gray-600: #5b6072;
    --gray-500: #767b8c;
    --card-border: #ececef;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  body {
    background: linear-gradient(135deg, #eef0fb 0%, #f7f5fb 45%, #f4f6fc 100%);
    min-height: 100vh;
    position: relative;
  }

  .back-link {
    position: absolute;
    top: 32px;
    left: 40px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--gray-600);
    font-size: 15px;
  }

  .back-link svg { width: 16px; height: 16px; }

  .center {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 448px;
    background: #fff;
    border-radius: 24px;
    padding: 48px 40px 40px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(20,23,43,0.06);
  }

  .icon-circle {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #f0f1f5;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
  }

  .icon-circle svg {
    width: 32px;
    height: 32px;
    color: var(--ink);
  }

  .card h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 14px;
  }

  .card-sub {
    font-size: 15px;
    line-height: 1.6;
    color: var(--gray-500);
    margin-bottom: 28px;
  }

  .field {
    text-align: left;
    margin-bottom: 24px;
  }

  .field label {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    border: 1px solid var(--card-border);
    background: #f7f8fb;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--ink);
    outline: none;
  }

  .field input::placeholder { color: #b3b6c0; }

  .field input:focus {
    border-color: var(--ink);
    background: #fff;
  }

  .submit-btn {
    width: 100%;
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 16px;
    border-radius: 999px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 20px;
  }

  .submit-btn:hover { background: #23273f; }
  .submit-btn:disabled { opacity: 0.65; cursor: not-allowed; }

  .resend {
    font-size: 14px;
    color: var(--gray-500);
  }

  .resend a {
    color: var(--ink);
    font-weight: 700;
    text-decoration: none;
  }

  .form-error {
    display: none;
    background: #fdecea;
    border: 1px solid #f5c2bc;
    color: #b3261e;
    font-size: 13.5px;
    padding: 11px 14px;
    border-radius: 10px;
    margin-bottom: 18px;
    text-align: left;
  }

  @media (max-width: 480px) {
    .back-link { position: static; margin: 24px 0 0 20px; }
    .center { padding-top: 0; }
    .card { padding: 40px 28px 32px; }
  }
</style>
</head>
<body>

  <a href="Log_In__Light_.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Login
  </a>

  <div class="center">
    <div class="card" id="resetCard">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>

      <h1>Set New Password</h1>
      <p class="card-sub" id="cardSub">Choose a new password for your account.</p>

      <div class="form-error" id="formError"></div>

      <form id="resetForm" novalidate>
        <div class="field">
          <label for="newPassword">New Password</label>
          <input id="newPassword" type="password" placeholder="At least 8 characters" autocomplete="new-password" required minlength="8" />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" type="password" placeholder="Re-enter password" autocomplete="new-password" required minlength="8" />
        </div>

        <button class="submit-btn" type="submit" id="submitBtn">Update Password</button>
      </form>

      <div class="resend"><a href="Log_In__Light_.html">Back to login</a></div>
    </div>

    <div class="card" id="doneCard" style="display:none;">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4L12 14.01l-3-3"/><path d="M2 12a10 10 0 1 1 6.29 9.29"/></svg>
      </div>
      <h1>Password updated</h1>
      <p class="card-sub">You can now sign in with your new password.</p>
      <a href="Log_In__Light_.html" class="submit-btn" style="display:block; text-decoration:none; line-height:1.4;">Go to Login</a>
    </div>
  </div>

<script src="js/config.js"></script>
<script src="js/api-client.js"></script>
<script>
  const resetCard = document.getElementById('resetCard');
  const doneCard = document.getElementById('doneCard');
  const cardSub = document.getElementById('cardSub');
  const form = document.getElementById('resetForm');
  const errorBox = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');

  const token = new URLSearchParams(window.location.search).get('token');

  if (!token) {
    cardSub.textContent = 'This reset link is missing its token.';
    form.style.display = 'none';
    errorBox.textContent = 'Open the link from your password reset email again, or request a new one from the login page.';
    errorBox.style.display = 'block';
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword.length < 8) {
      showError('Password must be at least 8 characters.');
      return;
    }
    if (newPassword !== confirmPassword) {
      showError('Passwords do not match.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    try {
      await AloftApi.resetPassword(token, newPassword);
      resetCard.style.display = 'none';
      doneCard.style.display = 'block';
    } catch (err) {
      showError(err.message || 'That reset link is invalid or has expired.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Password';
    }
  });
</script>

</body>
</html>
