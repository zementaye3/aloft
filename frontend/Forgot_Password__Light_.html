<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Aloft</title>
<style>
  :root {
    --ink: #14172b;
    --gray-600: #5b6072;
    --gray-500: #767b8c;
    --card-border: #ececef;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
  }

  body {
    background: linear-gradient(135deg, #eef0fb 0%, #f7f5fb 45%, #f4f6fc 100%);
    min-height: 100vh;
    position: relative;
  }

  .back-link {
    position: absolute;
    top: 32px;
    left: 40px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--gray-600);
    font-size: 15px;
  }

  .back-link svg { width: 16px; height: 16px; }

  .center {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 448px;
    background: #fff;
    border-radius: 24px;
    padding: 48px 40px 40px;
    text-align: center;
    box-shadow: 0 30px 60px rgba(20,23,43,0.06);
  }

  .icon-circle {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #f0f1f5;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
  }

  .icon-circle svg {
    width: 32px;
    height: 32px;
    color: var(--ink);
  }

  .card h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 14px;
  }

  .card-sub {
    font-size: 15px;
    line-height: 1.6;
    color: var(--gray-500);
    margin-bottom: 28px;
  }

  .field {
    text-align: left;
    margin-bottom: 24px;
  }

  .field label {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .field input {
    width: 100%;
    border: 1px solid var(--card-border);
    background: #f7f8fb;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--ink);
    outline: none;
  }

  .field input::placeholder { color: #b3b6c0; }

  .field input:focus {
    border-color: var(--ink);
    background: #fff;
  }

  .submit-btn {
    width: 100%;
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 16px;
    border-radius: 999px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 20px;
  }

  .submit-btn:hover { background: #23273f; }

  .resend {
    font-size: 14px;
    color: var(--gray-500);
  }

  .resend a {
    color: var(--ink);
    font-weight: 700;
    text-decoration: none;
  }

  @media (max-width: 480px) {
    .back-link { position: static; margin: 24px 0 0 20px; }
    .center { padding-top: 0; }
    .card { padding: 40px 28px 32px; }
  }
</style>
</head>
<body>

  <a href="Log_In__Light_.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Login
  </a>

  <div class="center">
    <div class="card" id="requestCard">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 6l10 7 10-7"/></svg>
      </div>

      <h1>Reset Password</h1>
      <p class="card-sub">Enter the email address associated with your account and we'll send you a link to reset your password.</p>

      <div class="form-error" id="formError" style="display:none; background:#fdecea; border:1px solid #f5c2bc; color:#b3261e; font-size:13.5px; padding:11px 14px; border-radius:10px; margin-bottom:18px; text-align:left;"></div>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" type="email" placeholder="name@example.com" autocomplete="email" required />
        </div>

        <button class="submit-btn" type="submit" id="submitBtn">Send Reset Link</button>
      </form>

      <div class="resend">Didn't receive the email? <a href="#" id="resendLink">Click to resend</a></div>
    </div>

    <div class="card" id="sentCard" style="display:none;">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4L12 14.01l-3-3"/><path d="M2 12a10 10 0 1 1 6.29 9.29"/></svg>
      </div>
      <h1>Check your inbox</h1>
      <p class="card-sub" id="sentMessage">If an account exists for that email, a reset link is on its way.</p>
      <div class="resend">Wrong email? <a href="#" id="tryAgainLink">Try again</a></div>
    </div>
  </div>

<script src="js/config.js"></script>
<script src="js/api-client.js"></script>
<script>
  const form = document.getElementById('forgotForm');
  const errorBox = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');
  const requestCard = document.getElementById('requestCard');
  const sentCard = document.getElementById('sentCard');
  const sentMessage = document.getElementById('sentMessage');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = 'block';
  }

  async function requestReset(email) {
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';
    try {
      // The backend always returns a generic success message here (it
      // never reveals whether an email is registered), so we show the
      // same "check your inbox" state either way.
      await AloftApi.forgotPassword(email);
      sentMessage.textContent = `If an account exists for ${email}, a reset link is on its way.`;
      requestCard.style.display = 'none';
      sentCard.style.display = 'block';
    } catch (err) {
      showError(err.message || 'Something went wrong. Please try again.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send Reset Link';
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) {
      showError('Enter your email address.');
      return;
    }
    requestReset(email);
  });

  document.getElementById('resendLink').addEventListener('click', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (email) requestReset(email);
  });

  document.getElementById('tryAgainLink').addEventListener('click', (e) => {
    e.preventDefault();
    sentCard.style.display = 'none';
    requestCard.style.display = 'block';
  });
</script>

</body>
</html>
